# Réplica local del servidor (PostgreSQL + PostgREST) para probar sin cuenta en la nube.
# docker compose -f backend/test/docker-compose.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: blueway-test
    ports:
      - "54329:5432"
    volumes:
      - ./init_roles.sql:/docker-entrypoint-initdb.d/01_roles.sql:ro
      - ../schema.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
  api:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:blueway-test@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
    ports:
      - "54330:3000"
