name: APK de BlueWay

# Cada push a main compila la app, pasa los tests y publica el APK en la release "latest".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # El runner ya trae el SDK de Android en ANDROID_HOME.
      - name: Instalar plataforma Android
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms"
      - name: Tests y compilación
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain --no-daemon
      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk BlueWay.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BlueWay-apk
          path: BlueWay.apk
      - name: Publicar en la release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BlueWay.apk \
            --target "$GITHUB_SHA" \
            --title "BlueWay (última versión)" \
            --notes "Compilación ${GITHUB_RUN_NUMBER} del commit ${GITHUB_SHA::7}. Descarga BlueWay.apk en el móvil para instalarla o actualizarla."
